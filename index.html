<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARLESF SHOP</title>
<style>
:root{
  --forest:#173628;
  --forest-deep:#0e2119;
  --sage:#e7efe4;
  --sage-line:#cddccb;
  --cream:#faf7ef;
  --gold:#c69a2e;
  --gold-soft:#e7c876;
  --ink:#20241f;
  --ink-soft:#5b6459;
  --white:#ffffff;
  --danger:#a8442f;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Manrope',-apple-system,Segoe UI,sans-serif;
  line-height:1.5;
}
h1,h2,h3,.display{
  font-family:'Fraunces','Georgia',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--forest-deep);
}
img{max-width:100%;display:block;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ---------- top bar ---------- */
.topbar{
  background:var(--forest-deep);
  color:var(--sage);
  font-size:0.82rem;
  padding:8px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.topbar a{text-decoration:none;color:var(--gold-soft);}
.topbar .contact-links{display:flex;gap:18px;flex-wrap:wrap;}
.lang-toggle{
  display:flex;
  border:1px solid rgba(255,255,255,0.25);
  border-radius:20px;
  overflow:hidden;
}
.lang-toggle button{
  background:transparent;
  border:none;
  color:var(--sage);
  padding:4px 12px;
  font-size:0.78rem;
  font-weight:600;
}
.lang-toggle button.active{background:var(--gold);color:var(--forest-deep);}

/* ---------- header / hero ---------- */
header.hero{
  position:relative;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(198,154,46,0.25), transparent 60%),
    linear-gradient(160deg,var(--forest) 0%, var(--forest-deep) 65%);
  color:var(--sage);
  padding:26px 24px 70px;
  overflow:hidden;
}
.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:1180px;
  margin:0 auto 40px;
  flex-wrap:wrap;
  gap:14px;
}
.brand{
  display:flex;
  flex-direction: column;
  align-items:center;
  gap:15px;
  margin: 0 auto;
  text-align: center;
}
.brand-mark{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(140deg,var(--gold-soft),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:var(--forest-deep);font-size:2.5rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.brand-name{
  font-family:'Fraunces',serif;
  font-size:3.5rem;
  color:var(--cream);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0;
}
.brand-name span{color:var(--gold-soft);}

.nav-links{
  display:flex;gap:26px;font-size:0.92rem;
  width: 100%; justify-content: center; margin-top: 20px;
}
.nav-links a{text-decoration:none;color:var(--sage);opacity:0.85;}
.nav-links a:hover{opacity:1;}

.hero-body{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr;
  gap:40px;
  align-items:center;
  text-align: center;
}
.hero-body h1{
  font-size:clamp(2.5rem,5vw,4rem);
  color:var(--cream);
  margin:0 0 18px;
  line-height:1.08;
}
.hero-body p{
  color:var(--sage-line);
  font-size:1.1rem;
  max-width:60ch;
  margin:0 auto 28px;
}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap; justify-content: center;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:15px 28px;
  border-radius:9px;
  font-weight:700;
  font-size:1rem;
  text-decoration:none;
  border:1px solid transparent;
  transition:transform .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-gold{background:var(--gold);color:var(--forest-deep);}
.btn-outline{border-color:rgba(250,247,239,0.4);color:var(--cream);}

.hero-art{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
