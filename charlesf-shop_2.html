<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARLES SHOP</title>
<style>
:root{
  --forest:#173628;
  --forest-deep:#0e2119;
  --sage:#e7efe4;
  --sage-line:#cddccb;
  --cream:#faf7ef;
  --gold:#c69a2e;
  --gold-soft:#e7c876;
  --ink:#20241f;
  --ink-soft:#5b6459;
  --white:#ffffff;
  --danger:#a8442f;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Manrope',-apple-system,Segoe UI,sans-serif;
  line-height:1.5;
}
h1,h2,h3,.display{
  font-family:'Fraunces','Georgia',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--forest-deep);
}
img{max-width:100%;display:block;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ---------- top bar ---------- */
.topbar{
  background:var(--forest-deep);
  color:var(--sage);
  font-size:0.82rem;
  padding:8px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.topbar a{text-decoration:none;color:var(--gold-soft);}
.topbar .contact-links{display:flex;gap:18px;flex-wrap:wrap;}
.lang-toggle{
  display:flex;
  border:1px solid rgba(255,255,255,0.25);
  border-radius:20px;
  overflow:hidden;
}
.lang-toggle button{
  background:transparent;
  border:none;
  color:var(--sage);
  padding:4px 12px;
  font-size:0.78rem;
  font-weight:600;
}
.lang-toggle button.active{background:var(--gold);color:var(--forest-deep);}

/* ---------- header / hero ---------- */
header.hero{
  position:relative;
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(198,154,46,0.25), transparent 60%),
    linear-gradient(160deg,var(--forest) 0%, var(--forest-deep) 65%);
  color:var(--sage);
  padding:26px 24px 70px;
  overflow:hidden;
}
.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:1180px;
  margin:0 auto 40px;
  flex-wrap:wrap;
  gap:14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-mark{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(140deg,var(--gold-soft),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:var(--forest-deep);font-size:1.15rem;
}
.brand-name{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--cream);}
.brand-name span{color:var(--gold-soft);}

.nav-links{display:flex;gap:26px;font-size:0.92rem;}
.nav-links a{text-decoration:none;color:var(--sage);opacity:0.85;}
.nav-links a:hover{opacity:1;}

.hero-body{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  align-items:center;
}
.hero-body h1{
  font-size:clamp(2.2rem,4.4vw,3.4rem);
  color:var(--cream);
  margin:0 0 18px;
  line-height:1.08;
}
.hero-body p{
  color:var(--sage-line);
  font-size:1.05rem;
  max-width:46ch;
  margin:0 0 28px;
}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;
  border-radius:9px;
  font-weight:700;
  font-size:0.95rem;
  text-decoration:none;
  border:1px solid transparent;
  transition:transform .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn-gold{background:var(--gold);color:var(--forest-deep);}
.btn-outline{border-color:rgba(250,247,239,0.4);color:var(--cream);}

.hero-art{
  position:relative;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.hero-jar{
  background:rgba(250,247,239,0.06);
  border:1px solid rgba(250,247,239,0.15);
  border-radius:16px;
  padding:18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.hero-jar svg{width:56px;height:56px;}
.hero-jar span{font-size:0.78rem;color:var(--sage-line);text-align:center;}

/* ---------- category strip ---------- */
.cat-strip{
  max-width:1180px;
  margin:-40px auto 0;
  padding:0 24px;
  position:relative;
  z-index:3;
}
.cat-inner{
  background:var(--white);
  border-radius:16px;
  box-shadow:0 18px 40px -20px rgba(23,54,40,0.35);
  padding:16px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.cat-btn{
  border:1px solid var(--sage-line);
  background:var(--sage);
  color:var(--forest-deep);
  padding:10px 18px;
  border-radius:24px;
  font-size:0.86rem;
  font-weight:700;
  white-space:nowrap;
  flex-shrink:0;
}
.cat-btn.active{background:var(--forest-deep);color:var(--cream);border-color:var(--forest-deep);}

/* ---------- search ---------- */
.toolbar{
  max-width:1180px;
  margin:26px auto 0;
  padding:0 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.search-box{
  flex:1;min-width:220px;
  display:flex;align-items:center;gap:8px;
  background:var(--white);
  border:1px solid var(--sage-line);
  border-radius:10px;
  padding:10px 14px;
}
.search-box input{
  border:none;outline:none;background:transparent;
  font-size:0.95rem;width:100%;color:var(--ink);
}
.result-count{font-size:0.85rem;color:var(--ink-soft);white-space:nowrap;}

/* ---------- sections ---------- */
main{max-width:1180px;margin:0 auto;padding:34px 24px 60px;}
.section-block{margin-top:52px;}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--sage-line);
  padding-bottom:10px;margin-bottom:22px;
}
.section-head h2{font-size:1.55rem;margin:0;}
.section-head .count{font-size:0.85rem;color:var(--ink-soft);}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}
.card{
  background:var(--white);
  border:1px solid var(--sage-line);
  border-radius:14px;
  overflow:hidden;
  display:flex;flex-direction:column;
  transition:box-shadow .18s ease, transform .18s ease;
}
.card:hover{box-shadow:0 16px 30px -18px rgba(23,54,40,0.4);transform:translateY(-3px);}
.card-art{
  height:150px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.card-art svg{width:74px;height:74px;}
.badge-oos{
  position:absolute;top:10px;left:10px;
  background:var(--danger);color:#fff;
  font-size:0.7rem;font-weight:700;
  padding:4px 9px;border-radius:20px;
}
.badge-pv{
  position:absolute;top:10px;right:10px;
  background:rgba(23,54,40,0.85);color:var(--gold-soft);
  font-size:0.7rem;font-weight:700;
  padding:4px 9px;border-radius:20px;
}
.card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.card-body h3{font-size:1rem;margin:0;line-height:1.3;color:var(--forest-deep);min-height:2.5em;}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.price{font-family:'Fraunces',serif;font-size:1.25rem;color:var(--forest-deep);font-weight:600;}
.order-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--forest-deep);color:var(--cream);
  border:none;border-radius:8px;
  padding:9px 14px;font-size:0.82rem;font-weight:700;
}
.order-btn:hover{background:var(--forest);}
.order-btn.disabled{background:#c8cdc4;color:#7a8177;pointer-events:none;}
.order-btn svg{width:15px;height:15px;}

/* ---------- footer ---------- */
footer{
  background:var(--forest-deep);
  color:var(--sage-line);
  padding:44px 24px 26px;
  margin-top:60px;
}
.footer-inner{
  max-width:1180px;margin:0 auto;
  display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;
}
.footer-col h3{color:var(--cream);font-size:1.1rem;margin:0 0 12px;}
.footer-col p, .footer-col a{color:var(--sage-line);text-decoration:none;font-size:0.92rem;}
.footer-col a{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.footer-bottom{
  max-width:1180px;margin:34px auto 0;padding-top:18px;
  border-top:1px solid rgba(250,247,239,0.12);
  font-size:0.78rem;color:rgba(231,239,228,0.5);
  text-align:center;
}

/* whatsapp float */
.wa-float{
  position:fixed;bottom:22px;right:22px;z-index:50;
  background:#1ea952;color:#fff;
  border-radius:50px;
  padding:13px 20px;
  display:flex;align-items:center;gap:9px;
  font-weight:700;font-size:0.9rem;
  text-decoration:none;
  box-shadow:0 14px 26px -10px rgba(30,169,82,0.6);
}
.wa-float svg{width:20px;height:20px;}

@media(max-width:860px){
  .hero-body{grid-template-columns:1fr;}
  .hero-art{grid-template-columns:repeat(4,1fr);}
  .hero-jar span{display:none;}
}
[data-lang="en"] [data-es]{display:none;}
[data-lang="es"] [data-en]{display:none;}
</style>

/* ---------------- language ---------------- */
let lang = "es";
function setLang(l){
  lang = l;
  document.body.setAttribute("data-lang", l);
  document.querySelectorAll(".lang-toggle button").forEach(b=>{
    b.classList.toggle("active", b.dataset.setlang === l);
  });
  const si = document.getElementById("searchInput");
  si.placeholder = l === "es" ? si.dataset.esPh : si.dataset.enPh;
  render();
}
document.querySelectorAll("[data-setlang]").forEach(b=>{
  b.addEventListener("click", ()=> setLang(b.dataset.setlang));
});
document.getElementById("searchInput").placeholder = document.getElementById("searchInput").dataset.esPh;

/* ---------------- hero art ---------------- */
const heroArt = document.getElementById("heroArt");
["jar","tea","capsule","pot"].forEach(k=>{
  const d = document.createElement("div");
  d.className = "hero-jar";
  d.innerHTML = ICONS[k] + `<span data-es-fill></span>`;
  heroArt.appendChild(d);
});
const heroLabels = {es:["Cuidado de la piel","Tés e infusiones","Suplementos","Ollas de energía"],
                     en:["Skin care","Teas & infusions","Supplements","Energy pots"]};
function fillHeroLabels(){
  [...heroArt.children].forEach((d,i)=>{
    d.querySelector("span").textContent = heroLabels[lang][i];
  });
}
fillHeroLabels();

/* ---------------- category nav ---------------- */
const catNav = document.getElementById("catNav");
let activeCat = "all";
function buildCatNav(){
  catNav.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "cat-btn" + (activeCat==="all" ? " active":"");
  allBtn.textContent = lang==="es" ? "Todos los productos" : "All products";
  allBtn.onclick = ()=>{activeCat="all"; buildCatNav(); render();};
  catNav.appendChild(allBtn);
  CATS.forEach(c=>{
    const b = document.createElement("button");
    b.className = "cat-btn" + (activeCat===c.id ? " active":"");
    b.textContent = lang==="es" ? c.es : c.en;
    b.onclick = ()=>{activeCat=c.id; buildCatNav(); document.getElementById(c.id)?.scrollIntoView({behavior:"smooth",block:"start"}); render();};
    catNav.appendChild(b);
  });
}

/* ---------------- render catalog ---------------- */
const catalog = document.getElementById("catalog");
const resultCount = document.getElementById("resultCount");
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", render);

function waLink(p){
  const name = lang==="es" ? p.es : p.en;
  const msg = lang==="es"
    ? `Hola CharlesF Shop, quiero ordenar: ${name} ($${p.price})`
    : `Hi CharlesF Shop, I'd like to order: ${name} ($${p.price})`;
  return `https://wa.me/13057605842?text=${encodeURIComponent(msg)}`;
}

function render(){
  const term = searchInput.value.trim().toLowerCase();
  catalog.innerHTML = "";
  let total = 0;

  CATS.forEach(cat=>{
    if(activeCat !== "all" && activeCat !== cat.id) return;
    const items = PRODUCTS.filter(p=>{
      if(p.cat !== cat.id) return false;
      if(!term) return true;
      const name = (lang==="es" ? p.es : p.en).toLowerCase();
      return name.includes(term) || p.es.toLowerCase().includes(term) || p.en.toLowerCase().includes(term);
    });
    if(items.length === 0) return;
    total += items.length;

    const block = document.createElement("div");
    block.className = "section-block";
    block.id = cat.id;
    block.innerHTML = `
      <div class="section-head">
        <h2>${lang==="es" ? cat.es : cat.en}</h2>
        <span class="count">${items.length} ${lang==="es" ? "productos" : "products"}</span>
      </div>
      <div class="grid"></div>`;
    const grid = block.querySelector(".grid");

    items.forEach(p=>{
      const name = lang==="es" ? p.es : p.en;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-art" style="background:linear-gradient(160deg,var(--sage),var(--white));">
          ${p.oos ? `<span class="badge-oos">${lang==="es"?"Agotado":"Out of stock"}</span>` : ""}
          <span class="badge-pv">${p.pv} PV</span>
          ${ICONS[p.icon]}
        </div>
        <div class="card-body">
          <h3>${name}</h3>
          <div class="price-row">
            <span class="price">$${p.price}</span>
            ${p.oos
              ? `<span class="order-btn disabled">${lang==="es"?"No disponible":"Unavailable"}</span>`
              : `<a class="order-btn" href="${waLink(p)}" target="_blank" rel="noopener">
                   <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1s-.7 1-.9 1.2c-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.7-1-2.3-.2-.6-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 2-1.4.2-.7.2-1.2.1-1.4-.1-.1-.3-.2-.5-.3z"/><path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.5A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3.1.9.9-3-.2-.3A8.2 8.2 0 1112 20.2z"/></svg>
                   ${lang==="es"?"Ordenar":"Order"}
                 </a>`}
          </div>
        </div>`;
      grid.appendChild(card);
    });
    catalog.appendChild(block);
  });

  if(total === 0){
    catalog.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px 0;">${lang==="es" ? "No se encontraron productos." : "No products found."}</p>`;
  }
  resultCount.textContent = `${total} ${lang==="es" ? "resultados" : "results"}`;
}

buildCatNav();
render();

/* re-fill hero labels + placeholder on lang change */
const origSetLang = setLang;
setLang = function(l){ origSetLang(l); fillHeroLabels(); buildCatNav(); };
</script>
</body>
</html>
